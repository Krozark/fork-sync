name: Sync All Forks

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build matrix from forks.yml
        id: build-matrix
        run: |
          python3 - <<'EOF'
          import json
          import os
          import yaml

          with open("forks.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f) or {}

          names = [{"name": item["name"]} for item in data.get("forks", [])]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": names}) + "\n")
          EOF

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync ${{ matrix.name }}
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: python3 scripts/sync_fork.py --config forks.yml --name "${{ matrix.name }}"
